services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: quant-clickhouse
    env_file:
      - ${WAREHOUSE_ENV_FILE:-/opt/quant_mcp/env/warehouse.env}
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ch_admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
    volumes:
      - /opt/quant_mcp/volumes/clickhouse:/var/lib/clickhouse
      - ./sql/clickhouse_init.sql:/docker-entrypoint-initdb.d/001_clickhouse_init.sql:ro
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8123/?query=SELECT%201' | grep -q 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: quant-postgres
    env_file:
      - ${WAREHOUSE_ENV_FILE:-/opt/quant_mcp/env/warehouse.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quant_warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-quant_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - /opt/quant_mcp/volumes/postgres:/var/lib/postgresql/data
      - ./sql/postgres_init.sql:/docker-entrypoint-initdb.d/001_postgres_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quant_admin} -d ${POSTGRES_DB:-quant_warehouse}"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: quant-minio
    env_file:
      - ${WAREHOUSE_ENV_FILE:-/opt/quant_mcp/env/warehouse.env}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-quant_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://127.0.0.1:9101}
    command: server /data --console-address ":9001"
    volumes:
      - /opt/quant_mcp/volumes/minio:/data
    ports:
      - "9100:9000"
      - "9101:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

networks:
  default:
    name: quant-cloud-center
