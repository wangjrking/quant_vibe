services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: quant-clickhouse
    env_file:
      - ${WAREHOUSE_ENV_FILE:-D:/quant/cloud-center/env/warehouse.env}
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ch_admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
    volumes:
      - ${QUANT_CLOUD_CENTER_ROOT:-D:/quant/cloud-center}/volumes/clickhouse:/var/lib/clickhouse
      - ./sql/clickhouse_init.sql:/docker-entrypoint-initdb.d/001_clickhouse_init.sql:ro
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8123/?query=SELECT%201' | grep -q 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: quant-postgres
    env_file:
      - ${WAREHOUSE_ENV_FILE:-D:/quant/cloud-center/env/warehouse.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quant_warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-quant_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ${QUANT_CLOUD_CENTER_ROOT:-D:/quant/cloud-center}/volumes/postgres:/var/lib/postgresql/data
      - ./sql/postgres_init.sql:/docker-entrypoint-initdb.d/001_postgres_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quant_admin} -d ${POSTGRES_DB:-quant_warehouse}"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: quant-minio
    env_file:
      - ${WAREHOUSE_ENV_FILE:-D:/quant/cloud-center/env/warehouse.env}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-quant_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://127.0.0.1:9101}
    command: server /data --console-address ":9001"
    volumes:
      - ${QUANT_CLOUD_CENTER_ROOT:-D:/quant/cloud-center}/volumes/minio:/data
    ports:
      - "9100:9000"
      - "9101:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  asset-registry-mcp:
    build:
      context: ../..
      dockerfile: deploy/cloud-center/mcp/Dockerfile
    container_name: quant-asset-registry-mcp
    environment:
      MCP_SERVICE_NAME: asset-registry-mcp
      MCP_SERVICE_PORT: 8101
    ports:
      - "8101:8101"
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ops-mcp:
    build:
      context: ../..
      dockerfile: deploy/cloud-center/mcp/Dockerfile
    container_name: quant-ops-mcp
    environment:
      MCP_SERVICE_NAME: ops-mcp
      MCP_SERVICE_PORT: 8102
    ports:
      - "8102:8102"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  audit-mcp:
    build:
      context: ../..
      dockerfile: deploy/cloud-center/mcp/Dockerfile
    container_name: quant-audit-mcp
    environment:
      MCP_SERVICE_NAME: audit-mcp
      MCP_SERVICE_PORT: 8103
    ports:
      - "8103:8103"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8103/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

networks:
  default:
    name: quant-cloud-center
