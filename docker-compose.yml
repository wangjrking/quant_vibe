services:
  quant-vibe:
    build:
      context: .
      args:
        INSTALL_TORCH: "false"
        INSTALL_GM: "false"
    image: quant-vibe:latest
    environment:
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      QUANT_DATA_DIR: /app/data_file
    volumes:
      - ./data_file:/app/data_file
      - ./log:/app/log
      - ./logs:/app/logs
      - ./juejin_strategies:/app/juejin_strategies
    command: ["python", "main.py"]
